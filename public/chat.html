<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat with a mentor - MentorMatch</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span>MentorMatch</span>
    </a>
    <p class="tagline">Ask a question before you book.</p>
    <a class="text-link" href="/">
      <span aria-hidden="true">←</span> Back to matches
    </a>
  </header>

  <main class="page-shell thread-page">
    <a class="back-link" href="/">
      <span aria-hidden="true">←</span> Back to matches
    </a>

    <section class="chat-panel thread-panel" id="thread-panel" aria-labelledby="mentor-name">
      <header class="thread-heading">
        <div class="mentor-identity">
          <span class="mentor-avatar" id="mentor-avatar" aria-hidden="true"></span>
          <div>
            <h1 id="mentor-name">Loading…</h1>
            <p id="mentor-meta"></p>
          </div>
        </div>
        <button class="book-button thread-book" type="button" id="book-slot">
          Book a slot
          <span aria-hidden="true">→</span>
        </button>
      </header>
      <div class="messages thread-log" id="thread" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation"></div>
      <form class="composer" id="chat-form">
        <label class="chatting-as" for="mentee-name">
          Your name
          <input id="mentee-name" name="menteeName" maxlength="80" autocomplete="name" required />
        </label>
        <div class="chat-input thread-composer">
          <label class="sr-only" for="message-text">Message</label>
          <textarea
            id="message-text"
            name="text"
            maxlength="2000"
            rows="2"
            placeholder="Ask about their experience, timing, or what a session covers"
            required
          ></textarea>
          <button type="submit" id="send-message">Send</button>
        </div>
        <p class="form-error" id="form-error" role="alert" hidden></p>
      </form>
    </section>

    <section class="result-card missing-card" id="missing-mentor" hidden>
      <h1>Mentor not found</h1>
      <p id="missing-text"></p>
      <a class="primary-button" href="/">Back to mentors</a>
    </section>
  </main>

  <script src="chat.js"></script>
</body>
</html>
